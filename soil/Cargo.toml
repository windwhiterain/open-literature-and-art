[package]
name = "soil"
version = "0.1.0"
edition = "2024"
description = "CLI tool to help non-programmers submit manuscripts via git submodule PR"

[[bin]]
name = "soil"
path = "src/main.rs"

[dependencies]
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
ctrlc = "3"
# sitegen as a library: the site builder ships inside the soil binary so
# users only need the single soil executable (no cargo/source required).
sitegen = { path = ".." }
