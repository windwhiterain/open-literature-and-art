[package]
name = "soil"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "soil"
path = "src/main.rs"

[features]
dev = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
dirs = "5"
anyhow = "1"
dialoguer = "0.11"
which = "7"
