name: Deploy to GitHub Pages

on:
  push:
    branches: [v1]
    # Only rebuild/deploy when something that affects the site changed:
    # author content (incl. submodule gitlinks), static pages, the sitegen
    # code, or this workflow itself. README/docs/soil changes skip the deploy.
    paths:
      - "authors/**"
      - "pages/**"
      - ".gitmodules"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --release

      - name: Build site
        run: cargo run --release -- --out-dir dist --check-links

      - name: Check soil compiles
        run: cargo build -p soil --release

      # 国内镜像：把构建产物部署到腾讯云 EdgeOne Pages（免费版每月 50GB 流量+300 万次请求）。
      # 全自动：npx edgeone pages deploy 把 dist/ 上传到 EdgeOne 项目。
      # 前提（一次性，需你在 EdgeOne 控制台完成）：注册 → 拿 API Token → （部署时 -n 自动建项目）
      # → 项目域名管理/自定义域名绑定 open-literature-and-art.top（大陆/全球可用区需 工信部备案，你已接受）
      # → 配置 DNS CNAME。默认项目域名在中国大陆仅 3 小时预览链接，稳定访问必须用自定义域名→所以绑备案域名。
      # token 放 repo secret EDGEONE_API_TOKEN（勿明文写入 workflow）。
      # best-effort：失败只标记该步骤，不阻断 GitHub Pages 部署（continue-on-error）。
      - name: Setup Node.js (for EdgeOne CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to EdgeOne Pages (国内镜像)
        continue-on-error: true
        run: npx -y edgeone pages deploy ./dist -n open-literature-and-art -t ${{ secrets.EDGEONE_API_TOKEN }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
