name: Deploy to GitHub Pages

on:
  push:
    branches: [v1]
    # Only rebuild/deploy when something that affects the site changed:
    # author content (incl. submodule gitlinks), static pages, the sitegen
    # code, or this workflow itself. README/docs/soil changes skip the deploy.
    paths:
      - "authors/**"
      - "pages/**"
      - ".gitmodules"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --release

      - name: Build site
        run: cargo run --release -- --out-dir dist --check-links

      - name: Check soil compiles
        run: cargo build -p soil --release

      # 国内镜像：把构建产物同步到腾讯云 COS 静态网站托管（纯国内、全自动）。
      # 前提（一次性，需你在腾讯云完成）：建好「公有读私有写」的存储桶 → 基础配置/静态网站
      # 开启、索引文档填 index.html → 绑定「静态网站源站」类型的已备案自定义域名。
      # 凭据放仓库 secrets（勿明文写入 workflow）：TENCENT_CLOUD_SECRET_ID / TENCENT_CLOUD_SECRET_KEY
      # / COS_BUCKET(形如 name-appid) / COS_REGION(如 ap-guangzhou)。
      # clean: true = 删除 COS 里本地已不存在的文件（真正的镜像同步）。
      # best-effort：失败只标记该步骤，不阻断 GitHub Pages 部署（continue-on-error）。
      - name: Deploy to Tencent Cloud COS (国内镜像)
        continue-on-error: true
        uses: TencentCloud/cos-action@v1
        with:
          secret_id: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}
          cos_region: ${{ secrets.COS_REGION }}
          local_path: dist
          remote_path: /
          clean: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
